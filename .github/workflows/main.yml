name: Realitni Radar Celakovice

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stazeni repozitare
        uses: actions/checkout@v4

      - name: Nastaveni Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalace knihoven a prohlizece Chromium
        run: |
          pip install playwright requests beautifulsoup4
          playwright install --with-deps chromium

      - name: Spusteni radaru
        run: python hlidac_celakovice.py

      - name: Ulozeni historie inzeratu a tabulky
        run: |
          git config --global user.name "Realitni Radar"
          git config --global user.email "radar@celakovice.local"
          git add databaze_nemovitosti.json README.md || true
          git diff --staged --quiet || git commit -m "Aktualizace radaru (Playwright)"
          git push